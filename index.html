<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrapesJS MJML Plugin</title>
    <link href="https://unpkg.com/grapesjs/dist/css/grapes.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/grapesjs"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }

      .cke_top {
        background: #444 !important;
      }

      .cke_chrome {
        border: none !important;
      }

      .cke_toolgroup {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>

  <body>
    <div id="gjs" style="height: 0px; overflow: hidden">
      <mjml>
        <mj-body>
          <mj-section background-color="#f0f0f0">
            <mj-column border="10px solid #F45E43">
              <mj-text font-family="Barlow">A first line of text</mj-text>
              <mj-spacer height="50px" />
            </mj-column>
          </mj-section>
        </mj-body>
      </mjml>
    </div>

    <script type="text/javascript">
      // Wait for the plugin to be injected by the dev server
      window.onload = () => {
        window.editor = grapesjs.init({
          height: '100%',
          noticeOnUnload: false,
          storageManager: false,
          fromElement: true,
          container: '#gjs',

          plugins: ['@leochen0204/grapesjs-mjml'],
          pluginsOpts: {
            '@leochen0204/grapesjs-mjml': {
              columnsPadding: '',
            },
          },
        });
      };
    </script>
  </body>
</html>
