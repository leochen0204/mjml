<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrapesJS MJML Plugin</title>
    <link href="https://unpkg.com/grapesjs/dist/css/grapes.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/grapesjs"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }

      .cke_top {
        background: #444 !important;
      }

      .cke_chrome {
        border: none !important;
      }

      .cke_toolgroup {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>

  <body>
    <div id="gjs" style="height: 0px; overflow: hidden"></div>

    <script type="text/javascript">
      // Wait for the plugin to be injected by the dev server
      window.onload = () => {
        window.editor = grapesjs.init({
          height: '100%',
          noticeOnUnload: false,
          storageManager: false,
          container: '#gjs',

          deviceManager: {
            devices: [
              { id: 'desktop', name: 'Desktop', width: '600px' },
              { id: 'tablet', name: 'Tablet', width: '480px' },
              { id: 'mobile', name: 'Mobile portrait', width: '320px' },
            ],
          },

          plugins: ['@leochen0204/grapesjs-mjml'],
          pluginsOpts: {
            '@leochen0204/grapesjs-mjml': {
              columnsPadding: '',
              useXmlParser: false,
            },
          },
        });

        window.editor.on('load', async () => {
          const res = await fetch('./template.mjml');
          const mjml = await res.text();
          window.editor.setComponents(mjml);
        });
      };
    </script>
  </body>
</html>
